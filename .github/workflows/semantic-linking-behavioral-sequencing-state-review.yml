name: Semantic Linking Behavioral Sequencing State Review

on:
  workflow_dispatch:
  push:
    paths:
      - '30_Product Capabilities/**'
      - '10_Products/**'
      - '99_System/09_Tools/review-behavioral-sequencing-state.py'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet PyYAML
      - name: Review behavioral sequencing and state links
        run: python 99_System/09_Tools/review-behavioral-sequencing-state.py
