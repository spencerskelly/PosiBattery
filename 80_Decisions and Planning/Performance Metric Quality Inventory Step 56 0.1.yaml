    - Values on file
    - Source rule
  model_changes: false

overall_assessment:
  status: "usable comparison library with mixed semantic maturity"
  strengths:
    - "Every metric note states a definition and comparison intent."
    - "Most metrics explicitly state unit/format, comparability rules, direction, and copied product values."
    - "The notes consistently declare product notes as the authoritative source for copied comparison values."
    - "Metrics already trace to Products, Functions, Designs, or reusable product classes through describes."
  primary_risks:
    - "The folder mixes measurable engineering properties, categorical attributes, comparison dimensions, commercial data, and compound summaries under one Performance Metric label."
    - "Several notes combine multiple independent quantities or concepts, reducing suitability as atomic reusable properties."
    - "Some cross-product-class merged metrics use one note for semantically different measurements."
    - "Most values are vendor-stated comparison evidence rather than controlled validation criteria."

