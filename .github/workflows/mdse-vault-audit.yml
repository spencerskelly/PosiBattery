name: MDSE Vault Audit

on:
  push:
    paths:
      - '**/*.md'
      - '**/*.yaml'
      - '**/*.base'
      - '**/*.canvas'
      - '.vault.yaml'
      - '99_System/**/*.py'
      - '.github/workflows/mdse-vault-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet PyYAML
      - name: Check identity invariants
        if: always()
        run: python 99_System/09_Tools/check-identities.py
      - name: Check relationship invariants
        if: always()
        run: python 99_System/09_Tools/check-relationships.py
      - name: Run vault audit
        if: always()
        run: python 99_System/09_Tools/audit-vault.py
      - name: Generate provenance quality report
        if: always()
        run: python 99_System/09_Tools/report-provenance.py
      - name: Generate orphan and traceability quality report
        if: always()
        run: python 99_System/09_Tools/report-traceability.py
      - name: Check note names and aliases
        if: always()
        run: python 99_System/check-names.py
      - name: Check strong function-design dependencies
        if: always()
        run: python 99_System/check-dependencies.py --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mdse-vault-audit
          path: |
            audit-report.md
            provenance-quality-report.md
            traceability-quality-report.md
