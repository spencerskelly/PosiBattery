schemaVersion: '1.0'
date: '2026-10-05'
basis: PosiBattery reconciliation Steps 73-82
purpose: "Sparse metadata contract layered on live element-types.yaml 1.19. Relationship fields remain governed only by live relationships.yaml 1.36."

identity:
  uid:
    required: true
    immutable: true
    meaning: "Permanent globally unique model-note identity."
  id:
    required: true
    immutableAfterCreation: true
    meaning: "Short human-readable class identifier. Reclassification does not by itself authorize changing an existing id."
  type:
    required: true
    authority: "element-types.yaml 1.19"
  subtype:
    requiredWhenClassDefinesValues: true
    authority: "element-types.yaml 1.19"

lifecycle:
  field: status
  required: true
  allowed: [Draft, Active, Retired]
  defaultModelNote: Draft
  meaning: "Review/lifecycle state only. It does not encode evidence confidence or commercial availability."

common:
  tags:
    value: list[text]
    required: true
    default: []
  aliases:
    value: list[text]
    required: false
    omitWhenEmpty: true
    migrationFrom: "Legacy body section ## Aliases; never maintain both as independent authorities."
  reuseScope:
    value: enum
    allowed: ["product-specific", "product-family", "platform-shared", "cross-product", "external-reference"]
    required: false
    meaning: "Intended breadth of reuse; named applicability remains appliesTo."

classScoped:
  Object:
    productClass:
      value: enum
      allowed: ["product-category", "product-type", "product-family", "product-variant", "specific-offering"]
      required: false
      condition: "Only for Objects representing commercial/product taxonomy identities."
    productCategory:
      value: enum
      allowed: ["battery", "battery-accessory", "charger", "charger-accessory", "industrial-truck", "gse", "vehicle-accessory", "fleet-software", "fuel-cell"]
      required: false
      condition: "Product Objects under 10_Products (concrete products and their abstract class notes). Coarse query category; subtypeOf remains the authority for the specific class."

    chemistry:
      value: enum
      allowed: ["flooded", "gel", "agm", "tppl", "vrla", "lfp", "nmc", "lithium-ion"]
      required: false
      condition: "Only when productCategory is battery. Stated cell chemistry. vrla = valve-regulated lead-acid with no gel or AGM stated; lithium-ion = lithium chemistry not stated more specifically. Never inferred from voltage."
    voltageClassV:
      value: list[number]
      required: false
      condition: "Only when productCategory is battery. Voltages the note states as offered, in V, as the source gives them (class or nominal). Omitted when only a range is stated."
    voltageMinV:
      value: number
      required: false
      condition: "Only when productCategory is battery. Lowest stated voltage in V."
    voltageMaxV:
      value: number
      required: false
      condition: "Only when productCategory is battery. Highest stated voltage in V."
    capacityAhMin:
      value: number
      required: false
      condition: "Only when productCategory is battery. Lowest stated capacity in Ah. Rating basis (C5, C3 and so on) is in the note body."
    capacityAhMax:
      value: number
      required: false
      condition: "Only when productCategory is battery. Highest stated capacity in Ah. Also used for up-to values."
    energyKwhMin:
      value: number
      required: false
      condition: "Only when productCategory is battery. Lowest stated energy in kWh."
    energyKwhMax:
      value: number
      required: false
      condition: "Only when productCategory is battery. Highest stated energy in kWh. Also used for up-to values."
    ratedCycles:
      value: number
      required: false
      condition: "Only when productCategory is battery. Highest stated rated cycle count. Depth of discharge and rate conditions are in the note body."
    chargeProfile:
      value: list[enum]
      allowed: ["conventional", "opportunity", "fast"]
      required: false
      condition: "Only when productCategory is battery or charger. Charging duties the note states the product is designed or rated for."
    powerKwMin:
      value: number
      required: false
      condition: "Only when productCategory is charger. Lowest stated output power in kW across the models or configurations the note covers."
    powerKwMax:
      value: number
      required: false
      condition: "Only when productCategory is charger. Highest stated output power in kW. Per-outlet or per-port basis is in the note body."
    outputVoltageMinV:
      value: number
      required: false
      condition: "Only when productCategory is charger. Lowest stated DC output or battery voltage in V."
    outputVoltageMaxV:
      value: number
      required: false
      condition: "Only when productCategory is charger. Highest stated DC output or battery voltage in V."
    outputCurrentMaxA:
      value: number
      required: false
      condition: "Only when productCategory is charger. Highest stated DC output current in A for one charging output. Omitted where sources disagree on basis."
    inputPhases:
      value: list[number]
      required: false
      condition: "Only when productCategory is charger. AC input phase counts the note states (1, 3)."
    supportedChemistries:
      value: list[enum]
      allowed: ["lead-acid", "lithium-ion"]
      required: false
      condition: "Only when productCategory is charger. Battery chemistries the note states the charger supports."
    moduleCountMin:
      value: number
      required: false
      condition: "Only when productCategory is charger. Lowest stated power module count per charger."
    moduleCountMax:
      value: number
      required: false
      condition: "Only when productCategory is charger. Highest stated power module count per charger."
    modulePowerKw:
      value: number
      required: false
      condition: "Only when productCategory is charger. Power of one module in kW when the note states a single module rating."
    airGapMmMin:
      value: number
      required: false
      condition: "Only when productCategory is charger. Lowest stated wireless air gap in mm."
    airGapMmMax:
      value: number
      required: false
      condition: "Only when productCategory is charger. Highest stated wireless air gap in mm."
    efficiencyPct:
      value: number
      required: false
      condition: "Only when productCategory is charger. Highest stated efficiency in percent. Test point and source conflicts are in the note body."
    ratedLoadKgMin:
      value: number
      required: false
      condition: "Only when productCategory is industrial-truck. Lowest stated rated load capacity in kg across the models the note covers. lb figures are converted at 0.45359237 kg per lb and rounded to the nearest kg; t figures are x1000."
    ratedLoadKgMax:
      value: number
      required: false
      condition: "Only when productCategory is industrial-truck. Highest stated rated load capacity in kg (same conversion). Also used for up-to values."
    systemVoltageV:
      value: list[number]
      required: false
      condition: "Only when productCategory is industrial-truck. Truck electrical system or battery voltages in V that the note states for the models it covers."
    powerSource:
      value: list[enum]
      allowed: ["lead-acid", "lithium-ion", "lp-gas"]
      required: false
      condition: "Only when productCategory is industrial-truck. Energy sources the note states the truck is offered with."
    interfaces:
      value: list[enum]
      allowed: ["can-bus", "bluetooth", "wi-fi", "cellular", "rfid", "lora", "ethernet", "usb", "rs-485", "rs-232"]
      required: false
      condition: "Only when productCategory is battery-accessory, charger-accessory, vehicle-accessory, fleet-software or gse. Communication interfaces the note states for the product itself. Interfaces only inferred from device type, or stated for a compatible product, are not recorded."
    detectionRangeM:
      value: number
      required: false
      condition: "Only when productCategory is vehicle-accessory. Highest stated detection distance in m (ft converted at 0.3048 and rounded to 2 decimals)."
  Info:
    measureClass:
      value: enum
      allowed: ["metric", "property-definition", "comparison-criterion"]
      required: false
      condition: "When the Info note is a governed measure definition."
    valueType:
      value: enum
      allowed: ["numeric", "categorical", "boolean", "text", "compound"]
      requiredWhen: "measureClass is present"
    unit:
      value: text-or-link
      requiredWhen: "measureClass is present and valueType is numeric and dimensional"
    measurementMethod:
      value: text-or-link
      required: false
      condition: "When method materially affects interpretation; executable methods should link to Procedure/Verification."

  Document:
    sourceClass:
      value: enum
      allowed: ["web-page", "datasheet", "brochure", "manual", "standard", "article", "database", "other"]
      required: false
      condition: "Required for curated Source Document records, not every Document."
    sourceUrl:
      value: url
      required: false
      condition: "Required for Source Document when original locator is known."
    sourceRevision:
      value: text
      required: false
    accessed:
      value: date
      required: false

excludedCommonFields:
  element_type: "Use type."
  title: "Use semantic Markdown heading/name."
  created: "Derive model creation timing from uid when needed."
  updated: "Use Git history."
  scope.applies_to: "Use appliesTo relationship."
  manufacturer: "Use madeBy/makes."
  need_holder: "Use hasNeed/needOf."
  organization_role: "Use playsRole/contextual business relationships."
  evidence.source_records: "Use references/describes/supports/contradicts."
  relationships: "Do not create a parallel structured relationship store."

compatibility:
  legacyNotesMissingSparseFields: valid
  aliasesBodyOnly: validUntilMigrated
  newFieldsDoNotAuthorizeBulkMigration: true
