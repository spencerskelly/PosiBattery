name: Semantic Linking Function Ownership Review

on:
  workflow_dispatch:
  push:
    paths:
      - '30_Product Capabilities/Product Functions/**'
      - '10_Products/**'
      - '99_System/09_Tools/review-function-ownership.py'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet PyYAML
      - name: Review Function ownership and decomposition
        run: python 99_System/09_Tools/review-function-ownership.py
