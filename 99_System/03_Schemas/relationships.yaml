symmetric:
- field: conflictsWith
  meaning: Mutual semantic incompatibility; author once and persist generated mirror for navigation.
oneWay:
- sequence
- initialState
- finalState
- trigger
- plannedDUTs
- scopeRequirements
- dut
- equipmentUsed
- providesSource
- providesLoad
- providesMeter
- providesInterfaceEquipment
- providesEnvironment
- providesFixture
- requiresSource
- requiresLoad
- requiresMeter
- requiresInterfaceEquipment
- requiresEnvironment
- requiresFixture
guidance:
  tracesTo: Migration/legacy escape hatch only. Prefer a stronger semantic relationship
    whenever possible.
  source_target: source/target are shared vocabulary for Item Flow and Transition.
    target replaces destination.
  composition: hasPart/partOf is the current generic decomposition/composition vocabulary
    in ruleset 1.18.

visibility:
  yaml: Paired and symmetric relationships must be visible from both endpoint notes after synchronization.
  breadcrumbs: All semantic relationship fields must be registered as Breadcrumbs edge fields.
  canvas: Semantic canvases should render labeled edges from authoritative forward fields when both endpoint notes are present.
  generated_inverse: Generated inverse/symmetric mirror fields are derivative data; do not hand-edit them as the authoritative source.
