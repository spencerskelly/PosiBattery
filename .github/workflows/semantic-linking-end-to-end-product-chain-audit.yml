name: Semantic Linking End-to-End Product Chain Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '10_Products/**'
      - '20_Product Architecture/**'
      - '30_Product Capabilities/**'
      - '40_Use and Operations/**'
      - '50_Customer Needs/**'
      - '99_System/09_Tools/review-end-to-end-product-chains.py'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet PyYAML
      - name: Audit end-to-end product chains
        run: python 99_System/09_Tools/review-end-to-end-product-chains.py
