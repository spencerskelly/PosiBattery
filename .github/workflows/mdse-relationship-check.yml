name: MDSE Relationship Check
# Step 94 final relationship gate

on:
  push:
    paths:
      - '.github/workflows/mdse-relationship-check.yml'
      - '99_System/09_Tools/check-relationships.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relationships:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet PyYAML
      - name: Run complete relationship validation
        run: python 99_System/09_Tools/check-relationships.py
