name: Semantic Linking Architecture Review

on:
  push:
    paths:
      - '20_Product Architecture/**/*.md'
      - '99_System/09_Tools/review-product-architecture-linking.py'
      - '.github/workflows/semantic-linking-architecture-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet PyYAML
      - name: Review architecture ownership and composition
        run: python 99_System/09_Tools/review-product-architecture-linking.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-architecture-linking-review
          path: product-architecture-linking-review.md
