naming_quality:
  strengths:
    - "Most names use action-oriented verb-object phrasing."
    - "Names are generally human-readable and behavior-centric."
    - "Concrete functions usually distinguish operating context in the name when needed."
  review_items:
    - "Some high-level names combine multiple intents, e.g. Manage Fleet Use and Data or Know and Protect Battery Condition."
    - "Truck-specific and generic vehicle wording coexist and may represent either valid scope specialization or inconsistent naming."
    - "Some functions include implementation/interface wording such as over CAN; these may be legitimate specialized behaviors but should be checked against Design separation."

reuse_quality:
  finding: "Many concrete functions are shared by multiple commercial products, which supports keeping them canonical and reusable."
  examples:
    - "Alert Operator of Hazards"
    - "Alert on Abnormal Condition"
    - "Charge Battery Fast"
    - "Communicate with Charger"
    - "Control Operator Access"
    - "Report Truck Telemetry"
  implication: "Do not duplicate functions under individual product folders."

step_51_focus:
  - "Build meaningful navigation categories from behavioral purpose, not arbitrary note counts."
  - "Potential categories include charging/energy transfer, battery sensing/health, communications/data, fleet management, vehicle control/stability, operator interface/safety, environment/durability, and battery maintenance."
  - "Do not change semantic hierarchy merely to match folders."

step_52_focus:
  - "Validate the six broad hierarchy-gap candidates."
  - "Review truck-specific versus vehicle-general functions for true specialization."
  - "Do not infer subtypeOf solely from similar wording."

step_53_focus:
  - "Review the listed overlap groups for equivalence, parent/child relationship, or legitimate distinct context."

step_54_focus:
  - "Measure performer/product, Need, Use Case, Requirement, Design, and evidence traceability systematically."
