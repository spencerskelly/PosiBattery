name: MDSE Product Facets Check

on:
  push:
    paths:
      - '.github/workflows/mdse-product-facets-check.yml'
      - '99_System/09_Tools/check-product-facets.py'
      - '99_System/03_Schemas/element-types.yaml'
      - '10_Products/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  facets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet PyYAML
      - name: Validate productCategory and facet properties
        run: python 99_System/09_Tools/check-product-facets.py
