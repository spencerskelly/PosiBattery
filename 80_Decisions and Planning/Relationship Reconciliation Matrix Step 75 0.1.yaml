business_relationship_reconciliation:
  principle: "Business predicates carry meaning that generic engineering predicates would lose. Move them into the governed schema after Organization is available rather than replacing them with weak generic links."
  predicates:
    - forward: playsRole
      inverse: rolePlayedBy
      from: [Organization]
      to: [Info]
      semantic_constraint: "Target is a reusable business-role definition."
      disposition: "govern"
    - forward: makes
      inverse: madeBy
      from: [Organization]
      to: [Object]
      meaning: "Organization designs/manufactures product and presents it as its own."
      disposition: "govern"
    - forward: offers
      inverse: offeredBy
      from: [Organization]
      to: [Object]
      meaning: "Organization sells/brands/offers product; maker may differ."
      disposition: "govern"
    - forward: supplierOf
      inverse: suppliedBy
      from: [Organization]
      to: [Organization]
      meaning: "Documented supply relationship."
      disposition: "govern"
    - forward: distributedBy
      inverse: distributorOf
      from: [Organization]
      to: [Organization]
      meaning: "Source organization's products are distributed through target organization."
      disposition: "govern"
    - forward: subsidiaryOf
      inverse: parentOf
      from: [Organization]
      to: [Organization]
      meaning: "Corporate ownership/organizational lineage."
      disposition: "govern"
    - forward: successorOf
      inverse: predecessorOf
      from: [Organization]
      to: [Organization]
      meaning: "Organization continues business/brand lineage of target."
      disposition: "govern"
      distinction: "Not supersedes: corporate succession is not model-note replacement."
    - forward: privateLabelFor
      inverse: privateLabelledBy
      from: [Organization]
      to: [Organization]
      meaning: "Source makes products sold under target's brand."
      disposition: "govern"
    - forward: poweredBy
      inverse: powers
      from: [Object]
      to: [Organization]
      meaning: "Product explicitly uses technology/platform supplied by organization."
      disposition: "govern"
    - forward: rebrandOf
      inverse: rebrandedAs
      from: [Object]
      to: [Object]
      meaning: "Commercial product is materially the same design offered under another brand."
      disposition: "govern"
      distinction: "Not copyOf: both products remain real commercial identities."
    - field: partnerOf
      symmetric: true
      between: [Organization]
      meaning: "Documented partnership."
      disposition: "govern"
    - field: integratesWith
      symmetric: true
      between: [Organization, Object]
      semantic_constraint: "Both endpoints must be valid Organization/Object combinations supported by explicit integration/compatibility evidence."
      disposition: "govern"
    - field: offeredWith
      symmetric: true
      between: [Object]
      meaning: "Products are explicitly offered/promoted together."
      disposition: "govern"

