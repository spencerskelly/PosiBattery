step: 56
purpose: "Review all Performance Metrics for duplicate risk, units/value semantics, measurement basis, applicability, traceability, and suitability as reusable properties or validation criteria."

scope:
  total_metric_notes: 55
  all_metric_notes_directly_inspected: true
  fields_and_sections_reviewed:
    - describes
    - Definition
