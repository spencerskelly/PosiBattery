field_governance_rules_from_reconciliation:
  - "Never create a second field for semantics already governed by type, uid, id, or a typed relationship merely to match the proposed metadata standard."
  - "Prefer model relationships for links to actors, organizations, needs, evidence sources, owners, and applicability when the link is itself an engineering/business claim."
  - "Use scalar metadata for compact intrinsic classifications that materially improve query or validation."
  - "Do not require manually maintained metadata that can be derived reliably from uid, Git, filenames/headings, or canonical relationships."
  - "A proposed type-specific field is not approved merely because it appears in Common Element Metadata Standard 0.1."
  - "New controlled values require explicit authority and migration behavior before schema adoption."

