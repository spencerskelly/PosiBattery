name: Semantic Linking Product Ecosystem Review

on:
  workflow_dispatch:
  push:
    paths:
      - '10_Products/**'
      - '50_Customer Needs/**'
      - '60_Stakeholders and Ecosystem/**'
      - '99_System/09_Tools/review-product-market-ecosystem.py'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet PyYAML
      - name: Review product ecosystem
        run: python 99_System/09_Tools/review-product-market-ecosystem.py
