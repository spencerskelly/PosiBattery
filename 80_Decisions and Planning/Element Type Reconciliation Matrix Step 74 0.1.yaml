endpoint_implications_for_step_75:
  - "Business relationships should use Organization endpoints where the subject/object is an institutional identity."
  - "Actor remains the endpoint for scenario participation, not automatically Organization."
  - "Customer Need endpoints should resolve to Use Case subtype why unless Step 75 needs a broader Use Case rule."
  - "Product endpoints should use Object with product classification rather than a Product class."
  - "Metric/evidence relationships must not assume a Metric class; use Info plus controlled measure classification until changed."
  - "Source support relationships should distinguish Document source records from Info research synthesis."
  - "Decision/planning relationships should target Plan, Issue, or Info according to actual semantics."

