    - "An external actor initiates, controls, or meaningfully participates in the scenario."
    - "The actor has an operational goal independent of a particular technical implementation."
    - "The scenario can have a recognizable trigger/start and useful completion condition."
    - "Product Functions support the scenario but are not substituted for the actor goal."
  exclude:
    - "Pure customer outcomes or business needs."
    - "Product-controlled Functions phrased as Use Cases."
    - "Technology choices or Design characteristics."
    - "Environmental conditions that are better modeled as scenario variants."
    - "Scenarios unsupported by current need/product/research evidence."

