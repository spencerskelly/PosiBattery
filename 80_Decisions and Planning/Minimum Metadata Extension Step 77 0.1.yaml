conclusion: "The minimum extension is intentionally sparse: two optional cross-cutting fields, one product-classification field, four measure-definition fields, and four source-provenance fields. Evidence-confidence, planning, commercial lifecycle, and additional need/function/design classifications are deferred until concrete workflows demonstrate that their value exceeds their maintenance cost."

