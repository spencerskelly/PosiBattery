name: Semantic Linking Completion Gate

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.md'
      - '**/*.yaml'
      - '**/*.base'
      - '**/*.canvas'
      - '.vault.yaml'
      - '99_System/**/*.py'
      - '.obsidian/plugins/mdse-workbench/**'
      - '.github/workflows/semantic-linking-completion-gate.yml'

permissions:
  contents: read

jobs:
  completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --quiet PyYAML

      - name: Identity validation
        run: python 99_System/09_Tools/check-identities.py

      - name: Relationship validation
        run: python 99_System/09_Tools/check-relationships.py

      - name: Structural vault audit
        run: python 99_System/09_Tools/audit-vault.py

      - name: Provenance report
        run: python 99_System/09_Tools/report-provenance.py

      - name: Traceability report
        run: python 99_System/09_Tools/report-traceability.py

      - name: Completion acceptance metrics
        run: python 99_System/09_Tools/check-semantic-linking-completion.py

      - name: Dependency validation
        run: python 99_System/check-dependencies.py --strict

      - name: True orphan review
        run: python 99_System/09_Tools/review-true-orphans.py

      - name: Weak traceability priority review
        run: python 99_System/09_Tools/review-weak-traceability-priority.py

      - name: End-to-end product chain audit
        run: python 99_System/09_Tools/review-end-to-end-product-chains.py

      - name: Curated source document review
        run: python 99_System/09_Tools/review-curated-source-documents.py

      - name: High-value evidence review
        run: python 99_System/09_Tools/review-high-value-evidence.py

      - name: Local Model review
        run: python 99_System/09_Tools/review-local-model-linking.py

      - name: Port and Item Flow review
        run: python 99_System/09_Tools/review-port-flow-linking.py

      - name: Workbench syntax
        run: node --check .obsidian/plugins/mdse-workbench/main.js

      - name: Workbench model review
        run: python 99_System/09_Tools/check-workbench-model.py

      - name: Name validation
        run: python 99_System/check-names.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-linking-completion-gate
          path: |
            audit-report.md
            provenance-quality-report.md
            traceability-quality-report.md
            true-orphan-review.md
            weak-traceability-priority-review.md
            end-to-end-product-chain-audit.md
            curated-source-document-review.md
            high-value-evidence-review.md
            local-model-linking-review.md
            port-flow-linking-review.md
            workbench-model-review.md
