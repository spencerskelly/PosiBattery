type_system_gaps_and_boundaries:
  - id: "ARCH-GAP-001"
    issue: "System, module, assembly, and component are useful architecture roles but are not governed Object subtypes in element-types.yaml 1.17."
    treatment: "Use Object plus explicit hasPart/partOf structure; do not invent new subtype values. Step 46 will test whether relationships are sufficient."
  - id: "ARCH-GAP-002"
    issue: "Physical connector hardware and interaction endpoints are distinct concepts, but current source notes often describe them together."
    treatment: "Keep connector hardware as Object candidates; create Port only when an owned endpoint is clearly identified."
  - id: "ARCH-GAP-003"
    issue: "Port subtype only distinguishes proxy versus full; it does not state electrical, CAN, charging, mechanical, or software-interface domain."
    treatment: "Do not overload subtype. Use name, classifier/relationships, flows, and evidence; record a schema gap if later architecture work needs a governed domain classification."
  - id: "ARCH-GAP-004"
    issue: "The existing Design vocabulary includes sensor/actuator/device names that can describe both a reusable design characteristic and a physical component."
    treatment: "Preserve the Design note and create/reuse a distinct Object only when structural architecture needs that entity. Do not convert the Design in place."
  - id: "ARCH-GAP-005"
    issue: "No Item Flow population is currently established in this hand-built architecture layer."
    treatment: "Do not create flows from protocol or interface names alone. Step 46 may identify supported information, energy, or material flows from explicit relationships/evidence."

