name: Semantic Linking Function Design Review

on:
  workflow_dispatch:
  push:
    paths:
      - '30_Product Capabilities/**'
      - '80_Decisions and Planning/BMID Function Design Traceability Step 89 0.1.yaml'
      - '99_System/09_Tools/review-function-design-realization.py'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet PyYAML
      - name: Review Function to Design realization
        run: python 99_System/09_Tools/review-function-design-realization.py
