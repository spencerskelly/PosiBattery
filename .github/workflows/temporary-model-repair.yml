name: Temporary Model Repair

on:
  push:
    paths:
      - '.github/workflows/temporary-model-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply repair helper
        run: python 99_System/09_Tools/repair_measurement_relations.py
      - name: Commit repaired relationships
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Repair current measurement relationships"
            git push
          fi
