name: Semantic Linking Weak Traceability Priority Review

on:
  workflow_dispatch:
  push:
    paths:
      - '10_Products/**'
      - '20_Product Architecture/**'
      - '30_Product Capabilities/**'
      - '80_Decisions and Planning/Semantic Linking Review Dispositions 0.1.yaml'
      - '99_System/09_Tools/review-weak-traceability-priority.py'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet PyYAML
      - name: Review weak traceability by priority
        run: python 99_System/09_Tools/review-weak-traceability-priority.py
