name: MDSE Relationship Check
# Step 94 final relationship gate

on:
  push:
    paths:
      - '.github/workflows/mdse-relationship-check.yml'
      - '99_System/09_Tools/check-relationships.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relationships:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet PyYAML
      - name: Run complete relationship validation
        id: validation
        continue-on-error: true
        run: |
          set -o pipefail
          python 99_System/09_Tools/check-relationships.py 2>&1 | tee "80_Decisions and Planning/Relationship Validation Step 94 Runtime Report.txt"
      - name: Persist relationship validation report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "80_Decisions and Planning/Relationship Validation Step 94 Runtime Report.txt"
          git diff --cached --quiet || git commit -m "Step 94 persist relationship validation report"
          git push
      - name: Enforce relationship gate result
        if: steps.validation.outcome == 'failure'
        run: exit 1
