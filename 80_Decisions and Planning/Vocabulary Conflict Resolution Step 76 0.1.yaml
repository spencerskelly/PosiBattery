purpose: "Resolve naming, controlled-value, alias, and overlapping-semantic vocabulary conflicts before selecting the minimum metadata extension in Step 77."

authorities:
  runtime_element_schema: "99_System/03_Schemas/element-types.yaml 1.17"
  runtime_relationship_schema: "99_System/03_Schemas/relationships.yaml 1.35"
