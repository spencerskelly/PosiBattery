core_traceability_additions:
  - forward: hasNeed
    inverse: needOf
    from: [Actor, Organization]
    to: [Use Case]
    semantic_constraint: "Target is a Customer Need represented as Use Case subtype why."
    meaning: "The stakeholder role or organization holds/experiences the need."
    evidence: "recommended for non-obvious organization-level claims"
    disposition: "add in Step 78 if Organization is adopted"
  - forward: arisesIn
    inverse: givesRiseTo
    from: [Use Case]
    to: [Use Case, Procedure, Setup]
    semantic_constraint: "Source is normally Use Case subtype why; target is an operational use/context/workflow."
    meaning: "The need becomes relevant in the target operational context."
    evidence: "recommended when not self-evident"
    disposition: "add"
  - forward: measures
    inverse: measuredBy
    from: [Info, Verification]
    to: any
    semantic_constraint: "Info source must be classified as an atomic measure/metric when measure_class is adopted."
    meaning: "The source defines or performs a measurement of the target property/outcome."
    evidence: "required for a material measurement claim"
    disposition: "add after Step 77 measure classification decision"
  - forward: supports
    inverse: supportedBy
    from: [Document, Info, Result]
    to: any
    meaning: "Source evidence materially supports the target assertion/element within stated applicability."
    limitation: "Note-level runtime can target elements, not an individual relationship assertion."
    evidence: "intrinsic by definition; source identity/provenance must be available"
    disposition: "add"
  - forward: contradicts
    inverse: contradictedBy
    from: [Document, Info, Result]
    to: any
    meaning: "Source evidence materially conflicts with the target assertion/element."
    limitation: "Note-level runtime can target elements, not an individual relationship assertion."
    evidence: "intrinsic by definition; conflict rationale must be recorded"
    disposition: "add"

existing_traceability_predicates:
  drives:
    disposition: "retain"
    canonical_meaning: "Source gives rise to/causes or materially motivates the target; distinct from affects."
    endpoints: "keep any -> any for compatibility; guidance should prefer Need/Issue/Decision/Use Case -> Requirement/Function/Design/Plan."
  satisfies:
    disposition: "retain and cautiously broaden"
    current: "Function|Design -> Requirement"
    proposed: "Function|Design|Object|Result -> Requirement|Use Case"
    semantic_constraint: "Use Case target must be a Customer Need (why); Result use requires demonstrated fulfillment, not mere evaluation."
    evidence_expectation: "required for Object/Result satisfaction claims; recommended for Function/Design"
    risk: "Do not use satisfies for intended contribution without evidence."
  realizedBy:
    disposition: "retain and broaden"
    current: "Use Case -> Function|Design"
    proposed: "Use Case|Function -> Function|Design"
    semantic_constraint:
      - "Customer Need/operational Use Case -> Function expresses behavior realization."
      - "Function -> Design expresses implementation of product-controlled behavior."
    exclusion: "Do not use realizedBy for simple product ownership; use hasDesign/hasPart."
  verifies:
    disposition: "retain and broaden"
    current: "Verification -> Requirement"
    proposed: "Verification|Result -> Requirement|Function|Design|Info"
    semantic_constraint: "Info target must be a governed measure/metric if used as verification target."
    evidence_expectation: "Verification defines intent; Result records execution evidence."
  appliesTo:
    disposition: "retain as semantic applicability relationship"
    current: "Requirement -> any"
    proposed: "Requirement|Design|Info -> any"
    semantic_constraint: "Info source must be a governed rule/measure/reference concept, not generic analysis."
    field_boundary: "Do not also add scope.applies_to as a second semantic applicability store."
  hasDesign:
    disposition: "retain and narrow canonical authoring"
    current: "Object|Document -> Design"
    proposed_canonical: "Object -> Design"
    compatibility: "Existing translated Document -> Design links may remain until individually reconciled."
    distinction: "hasDesign associates a reusable Design with the Object/product/system that owns or adopts it; realizedBy expresses behavior/intent implementation."
  references:
    disposition: "retain but keep non-evidentiary"
    meaning: "Mentions/cites; does not itself assert support."
    distinction: "Use supports when the source is evidence for the target."
  describes:
    disposition: "retain"
    meaning: "Document/Info/Artifact is about the target; does not imply evidence support or derivation."
  derivedFrom:
    disposition: "retain requirement-to-requirement for runtime"
    note: "Do not broaden to generic evidence provenance; use supports/references/describes depending on meaning."
  tracesTo:
    disposition: "retain provisional only"
    rule: "Every use remains a review finding and should be replaced by a stronger predicate when meaning becomes known."

