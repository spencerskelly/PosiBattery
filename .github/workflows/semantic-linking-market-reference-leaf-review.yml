name: Semantic Linking Market Reference Leaf Review

on:
  workflow_dispatch:
  push:
    paths:
      - '10_Products/**'
      - '70_Research and Evidence/Source Documents/**'
      - '80_Decisions and Planning/Semantic Linking Review Dispositions 0.1.yaml'
      - '99_System/09_Tools/review-market-reference-leaves.py'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet PyYAML
      - name: Review market reference leaves
        run: python 99_System/09_Tools/review-market-reference-leaves.py
