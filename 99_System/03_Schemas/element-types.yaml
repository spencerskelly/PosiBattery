schemaVersion: '1.19'
date: '2026-10-18'
basis: MDSE ruleset 1.23 + PosiBattery reconciliation Steps 73-82
commonProperties: [type, subtype, id, uid, status, tags]   # order fixed by W-97
optionalProperties:
  - name: abstract
    value: boolean
    default: false
    omitWhenDefault: true
    meaning: "Reusable definition may organize/generalize a specialization family but cannot itself be selected as the effective definition of an occurrence. Abstractness is not inherited (W-314/W-319)."
  - name: aliases
    value: list[text]
    omitWhenEmpty: true
    meaning: "Queryable alternate names, codes, abbreviations, and former names. Replaces the body alias list when a note is migrated."
  - name: reuseScope
    value: enum
    allowed: ["product-specific", "product-family", "platform-shared", "cross-product", "external-reference"]
    omitWhenBlank: true
    meaning: "Intended breadth of reuse; named applicability remains in appliesTo."
classOptionalProperties:
  Object:
    - {name: productClass, value: enum, allowed: ["product-category", "product-type", "product-family", "product-variant", "specific-offering"], sparse: true}
    - {name: productCategory, value: enum, allowed: ["battery", "battery-accessory", "charger", "charger-accessory", "industrial-truck", "gse", "vehicle-accessory", "fleet-software", "fuel-cell"], sparse: true, meaning: "Coarse product category for queries; mirrors the category folder under 10_Products and never replaces subtypeOf. Category facet properties (below) are valid only for their category."}
    - {name: chemistry, value: enum, allowed: ["flooded", "gel", "agm", "tppl", "vrla", "lfp", "nmc", "lithium-ion"], category: ["battery"], sparse: true, meaning: "Stated cell chemistry. vrla = valve-regulated lead-acid with no gel or AGM stated; lithium-ion = lithium chemistry not stated more specifically. Never inferred from voltage."}
    - {name: voltageClassV, value: "list[number]", category: ["battery"], sparse: true, meaning: "Voltages the note states as offered, in V, as the source gives them (class or nominal). Omitted when only a range is stated."}
    - {name: voltageMinV, value: number, category: ["battery"], sparse: true, meaning: "Lowest stated voltage in V."}
    - {name: voltageMaxV, value: number, category: ["battery"], sparse: true, meaning: "Highest stated voltage in V."}
    - {name: capacityAhMin, value: number, category: ["battery"], sparse: true, meaning: "Lowest stated capacity in Ah. Rating basis (C5, C3 and so on) is in the note body."}
    - {name: capacityAhMax, value: number, category: ["battery"], sparse: true, meaning: "Highest stated capacity in Ah. Also used for up-to values."}
    - {name: energyKwhMin, value: number, category: ["battery"], sparse: true, meaning: "Lowest stated energy in kWh."}
    - {name: energyKwhMax, value: number, category: ["battery"], sparse: true, meaning: "Highest stated energy in kWh. Also used for up-to values."}
    - {name: ratedCycles, value: number, category: ["battery"], sparse: true, meaning: "Highest stated rated cycle count. Depth of discharge and rate conditions are in the note body."}
    - {name: chargeProfile, value: "list[enum]", allowed: ["conventional", "opportunity", "fast"], category: ["battery", "charger"], sparse: true, meaning: "Charging duties the note states the product is designed or rated for."}
    - {name: powerKwMin, value: number, category: ["charger"], sparse: true, meaning: "Lowest stated output power in kW across the models or configurations the note covers."}
    - {name: powerKwMax, value: number, category: ["charger"], sparse: true, meaning: "Highest stated output power in kW. Per-outlet or per-port basis is in the note body."}
    - {name: outputVoltageMinV, value: number, category: ["charger"], sparse: true, meaning: "Lowest stated DC output or battery voltage in V."}
    - {name: outputVoltageMaxV, value: number, category: ["charger"], sparse: true, meaning: "Highest stated DC output or battery voltage in V."}
    - {name: outputCurrentMaxA, value: number, category: ["charger"], sparse: true, meaning: "Highest stated DC output current in A for one charging output. Omitted where sources disagree on basis."}
    - {name: inputPhases, value: "list[number]", category: ["charger"], sparse: true, meaning: "AC input phase counts the note states (1, 3)."}
    - {name: supportedChemistries, value: "list[enum]", allowed: ["lead-acid", "lithium-ion"], category: ["charger"], sparse: true, meaning: "Battery chemistries the note states the charger supports."}
    - {name: moduleCountMin, value: number, category: ["charger"], sparse: true, meaning: "Lowest stated power module count per charger."}
    - {name: moduleCountMax, value: number, category: ["charger"], sparse: true, meaning: "Highest stated power module count per charger."}
    - {name: modulePowerKw, value: number, category: ["charger"], sparse: true, meaning: "Power of one module in kW when the note states a single module rating."}
    - {name: airGapMmMin, value: number, category: ["charger"], sparse: true, meaning: "Lowest stated wireless air gap in mm."}
    - {name: airGapMmMax, value: number, category: ["charger"], sparse: true, meaning: "Highest stated wireless air gap in mm."}
    - {name: efficiencyPct, value: number, category: ["charger"], sparse: true, meaning: "Highest stated efficiency in percent. Test point and source conflicts are in the note body."}
  Info:
    - {name: measureClass, value: enum, allowed: ["metric", "property-definition", "comparison-criterion"], sparse: true}
    - {name: valueType, value: enum, allowed: ["numeric", "categorical", "boolean", "text", "compound"], sparse: true}
    - {name: unit, value: text-or-link, sparse: true}
    - {name: measurementMethod, value: text-or-link, sparse: true}
  Document:
    - {name: sourceClass, value: enum, allowed: ["web-page", "datasheet", "brochure", "manual", "standard", "article", "database", "other"], sparse: true}
    - {name: sourceUrl, value: url, sparse: true}
    - {name: sourceRevision, value: text, sparse: true}
    - {name: accessed, value: date, sparse: true}
relationshipFields: after governed optional properties (or after tags when none are present), in the order of relationships.yaml; may hold lists (W-126, W-319)
translatedOnlyProperties: [eaType]   # written by the translator, between status and tags (W-31, W-97)
classes:
- name: Object
  prefix: OBJ
  subtype: ["electrical", "circuit", "mechanical", "software", "firmware", "part"]
- name: Port
  prefix: PORT
  subtype: ["proxy", "full"]
- name: Item Flow
  prefix: IFLOW
  subtype: ["information", "energy", "material"]
- name: Function
  prefix: FUNC
  subtype: []
- name: Functional Flow
  prefix: FFLOW
  subtype: []
- name: State
  prefix: STATE
  subtype: []
- name: State Machine
  prefix: SM
  subtype: []
- name: Requirement
  prefix: REQ
  subtype: ["functional", "design", "standard", "stakeholder", "engineering"]
- name: Design
  prefix: DES
  subtype: []
- name: Use Case
  prefix: UC
  subtype: ["what", "where", "why", "when", "who"]
- name: Actor
  prefix: ACT
  subtype: []
- name: Organization
  prefix: ORG
  subtype: []
  note: 'Persistent institutional/business identity. Existing organization Info notes remain valid until individually migrated; preserve existing id and uid.'
- name: Failure Mode
  prefix: FM
  subtype: []
- name: Issue
  prefix: ISS
  subtype: ["engineering issue", "lifecycle risk"]
- name: Info
  prefix: INFO
  subtype: []
- name: Step
  prefix: STEP
  subtype: []
- name: Verification
  prefix: VER
  subtype: ["test", "analysis", "inspection", "demonstration"]
- name: Procedure
  prefix: PROC
  subtype: ["test", "assembly", "configuration", "commissioning", "calibration", "maintenance", "repair", "decommissioning"]
- name: Setup
  prefix: SETUP
  subtype: []
- name: Plan
  prefix: PLAN
  subtype: []
- name: Result
  prefix: RES
  subtype: []
- name: Document
  prefix: DOC
  subtype: []
- name: Artifact
  prefix: ART
  subtype: []
- name: modelCheck
  prefix: MC
  folder: null   # no folder of its own: translated notes stay in their EA package folders (W-117, W-181)
  subtype: ["Action", "StateNode", "Change", "Boundary", "Decision", "ActivityPartition", "Trigger", "Synchronization", "Sequence", "ActionPin", "ProxyConnector", "Event", "ActivityParameter", "Package"]
  note: 'Holding class for EA elements with no approved mapping; the subtype is the EA type (W-100, W-146, W-147). Sorted in stage 2 (Post-Import Task 7). Not meant to be created by hand (W-181).'
- name: Diagram
  prefix: DIA
  folder: 72_Diagrams
  subtype: ["custom", "logical", "use case", "composite structure", "statechart", "activity", "sequence", "package"]
