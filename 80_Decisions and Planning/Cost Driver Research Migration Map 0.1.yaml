    definition: "Comparisons, cost-driver framing, category landscapes, KPI frameworks, selection logic, ROI models, and cross-source interpretation."
    migration_treatment: "Preserve in the migrated research note."
  derived_conclusion:
    definition: "Statements inferred from the research, including recommended adjacencies, value propositions, prioritization, and business conclusions."
    migration_treatment: "Preserve as research conclusions; do not promote to canonical model facts."
  product_function_hypothesis:
    definition: "Candidate needs, functions, designs, architecture, product opportunities, integrations, requirements, metrics, or roadmap ideas."
    migration_treatment: "Preserve as hypotheses. Extraction into the model requires separate evidence-backed modeling work."

