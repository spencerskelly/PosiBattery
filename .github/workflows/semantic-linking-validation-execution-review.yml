name: Semantic Linking Validation Execution Review

on:
  workflow_dispatch:
  push:
    paths:
      - '20_Product Architecture/**'
      - '30_Product Capabilities/**'
      - '40_Use and Operations/**'
      - '99_System/09_Tools/review-validation-execution-relationships.py'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet PyYAML
      - name: Review validation execution relationships
        run: python 99_System/09_Tools/review-validation-execution-relationships.py
