name: Semantic Linking Architecture Design Review

on:
  workflow_dispatch:
  push:
    paths:
      - '30_Product Capabilities/Product Designs/**'
      - '30_Product Capabilities/Product Functions/**'
      - '10_Products/**'
      - '99_System/09_Tools/review-architecture-design-linking.py'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet PyYAML
      - name: Review architecture-to-design links
        run: python 99_System/09_Tools/review-architecture-design-linking.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-design-linking-review
          path: architecture-design-linking-review.md
