name: Semantic Linking True Orphan Review

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.md'
      - '80_Decisions and Planning/Semantic Linking Review Dispositions 0.1.yaml'
      - '99_System/09_Tools/review-true-orphans.py'
      - '99_System/09_Tools/report-traceability.py'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet PyYAML
      - name: Review true orphans
        run: python 99_System/09_Tools/review-true-orphans.py
