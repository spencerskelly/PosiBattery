- forward: subtypeOf
  inverse: supertypeOf
- forward: hasPart
  inverse: partOf
- forward: dependsOn
  inverse: dependencyOf
- forward: derivedFrom
  inverse: derivedBy
- forward: supersedes
  inverse: supersededBy
- forward: describes
