name: Semantic Linking Requirement Rationale Review

on:
  workflow_dispatch:
  push:
    paths:
      - '30_Product Capabilities/**'
      - '40_Use and Operations/**'
      - '50_Customer Needs/**'
      - '99_System/09_Tools/review-requirement-rationale.py'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet PyYAML
      - name: Review Requirement upstream rationale
        run: python 99_System/09_Tools/review-requirement-rationale.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: requirement-upstream-rationale-review
          path: requirement-upstream-rationale-review.md
